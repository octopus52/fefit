name: Update Leaderboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process Issues and Update JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'score-submission'
            });

            if (issues.data.length === 0) {
              console.log('Нет новых результатов.');
              return;
            }

            let leaderboard = [];
            try {
              const raw = fs.readFileSync('leaderboard.json', 'utf8');
              leaderboard = JSON.parse(raw);
            } catch (e) { /* файла нет или он пуст — ок */ }

            for (const issue of issues.data) {
              try {
                const data = JSON.parse(issue.body);
                if (data.player && typeof data.score === 'number') {
                  leaderboard.push({ player: data.player, score: data.score });
                }
              } catch (e) {
                console.log(`Issue #${issue.number} имеет неверный формат.`);
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 50);
            fs.writeFileSync('leaderboard.json', JSON.stringify(leaderboard, null, 2));

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add leaderboard.json
          git commit -m "Auto-update leaderboard" || exit 0
          git push
